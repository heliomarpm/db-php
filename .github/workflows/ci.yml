name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    # A "matrix" permite rodar o mesmo teste em várias versões do PHP simultaneamente
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dbphp_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      DB_MYSQL_HOST: 127.0.0.1
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: root
      DB_MYSQL_PASS: root
      DB_MYSQL_DATABASE: dbphp_test

    steps:
      - name: 📦 Checkout do código
        uses: actions/checkout@v7

      - name: 🐘 Configurar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none # Desativa a cobertura de código para deixar o teste mais rápido
          tools: composer:v2
          extensions: pdo, pdo_sqlite, mysqli

      - name: 🔍 Validar composer.json
        run: composer validate --strict

      - name: 📥 Instalar Dependências
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: 🔎 Análise Estática (PHPStan)
        run: composer lint

      - name: 🧪 Rodar Testes Unitários (PHPUnit)
        run: composer test
